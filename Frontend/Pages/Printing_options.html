<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" type="text/css" href="../Styling/Print_options.css">
</head>
<body>
    <!-- Part 1: top description of page/tool -->
     <h3> Choose 3D model</h3>

     <!-- Part 2: Model options inimage format : IMAGES MUST HAVE DESCRIPTIVE ALT TEXT -->
      <section class= "print-options">
        <section id = "image-box">
            <img src="../Assets/cylinder-1.png" alt="A 3D-rendered gray ccylindrical ring with vertical grooves on the outer surface.">
            <p id="img-description"><span style="display: block;"><strong>Cylindriacal ring</strong></span> Computer rendered image of a 3d printed audio spectrogram in the shape of a ring. 
                
            </p>
        </section>
        <section id = "image-box">
            <img src="../Assets/ring-1.png" alt = "Gray 3D-rendered ribbed bracelet or circular coil on a dark background, featuring a thicker clasp-like section at the front right.">
            <label>Concentrated ring</label>
        </section>

        <section id = "image-box">
            <img src="../Assets/ring-2.png" alt ="A gray, smooth, circular ring with a ridged texture is shown on a dark background." >
            <label>Spread out ring</label>
        </section>
      </section>

      <!-- Part 3: confirming option, preparing model and sending to print -->
       <section id="confirm-prep-send">
        <button aria-label="Confirm selected 3D model option"> Confirm Option</button>
        <section id = "prep">
            <img src="" alt="loading animation or icon"> 
            <p id="preparing-model-announcement"></p>
        </section>

        <button id="Send-to-lab" aria-label="Send selected model to Resonate"> Send to Resonate</button>
        <button aria-label="Print selected 3D model">Print</button>
        
       </section>

</body>
<script type="module" src="../Scripts/printing_options.js"></script>
<script type = "moddule" src = "../Scripts/trimming_logic.js"></script>
</html>
